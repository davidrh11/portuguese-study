<!DOCTYPE html>
<html lang="pt" translate="no">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversas · Português Europeu</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f5f0;--surface:#fff;--border:#e2ddd3;--text:#2b2b2b;--muted:#8a8578;--green:#006600;--red:#c0392b;--blue:#2a5f9e;--highlight:#eef5ee;--mono:'IBM Plex Mono',monospace;}
  *{box-sizing:border-box;}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0 16px;line-height:1.5;}
  .wrap{max-width:640px;margin:0 auto;padding:1.5rem 0 3rem;}
  header{display:flex;align-items:center;gap:0.8rem;margin-bottom:0.3rem;}
  h1{font-size:1.3rem;margin:0;}
  .sub{color:var(--muted);font-size:0.8rem;font-family:var(--mono);margin:0 0 1.5rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.4rem;margin-bottom:1rem;}
  .card h2{font-size:1rem;margin:0 0 0.6rem;}
  label.lab{display:block;font-family:var(--mono);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:0.9rem 0 0.35rem;}
  select{width:100%;font-family:var(--mono);font-size:0.9rem;padding:0.7rem 0.8rem;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);}
  .seg{display:flex;gap:0.5rem;flex-wrap:wrap;}
  .seg button{flex:1;min-width:120px;font-family:var(--mono);font-size:0.82rem;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.7rem 0.6rem;border-radius:7px;cursor:pointer;}
  .seg button.on{background:var(--green);border-color:var(--green);color:#fff;}
  .seg button small{display:block;font-size:0.66rem;opacity:0.75;margin-top:0.2rem;font-weight:400;}
  input[type=password],input[type=text]{width:100%;font-family:var(--mono);font-size:0.9rem;padding:0.7rem 0.8rem;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);}
  .note{font-size:0.78rem;color:var(--muted);margin:0.5rem 0 0;}
  .btn-go{width:100%;margin-top:1.2rem;font-family:var(--mono);font-size:0.92rem;font-weight:600;background:var(--green);color:#fff;border:none;border-radius:8px;padding:0.9rem;cursor:pointer;}
  .status{display:flex;align-items:center;gap:0.5rem;font-family:var(--mono);font-size:0.75rem;color:var(--muted);margin-bottom:0.8rem;min-height:1.2rem;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--border);flex:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .dot.speaking{background:var(--green);animation:pulse 1.2s infinite;}
  .dot.listening{background:var(--blue);animation:pulse 0.8s infinite;}
  .dot.thinking{background:#d08a00;animation:pulse 1.5s infinite;}
  #transcript{min-height:150px;max-height:44vh;overflow-y:auto;margin-bottom:0.8rem;}
  .turn{margin-bottom:0.9rem;}
  .who{font-family:var(--mono);font-size:0.64rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.15rem;}
  .bubble{padding:0.55rem 0.8rem;border-radius:8px;display:inline-block;max-width:100%;}
  .turn.bot .bubble{background:var(--highlight);}
  .turn.bot .who{color:var(--green);}
  .turn.you{text-align:right;}
  .turn.you .bubble{background:var(--green);color:#fff;}
  .turn.you .who{color:var(--blue);}
  .replay{background:none;border:none;cursor:pointer;font-size:0.85rem;margin-left:0.3rem;opacity:0.6;}
  .replay:hover{opacity:1;}
  #helpBox{background:#fffdf5;border:1px solid #e0d6b8;border-radius:8px;padding:0.6rem 0.8rem;margin-bottom:0.8rem;font-size:0.84rem;}
  #helpBox .hb-en{color:var(--muted);}
  #helpBox .hb-reply{color:var(--green);font-family:var(--mono);margin-top:0.3rem;}
  .inrow{display:flex;gap:0.4rem;align-items:center;}
  .inrow input{flex:1;}
  .mic,.send,.help{font-family:var(--mono);font-size:0.85rem;border:1px solid var(--border);border-radius:7px;padding:0.7rem 0.7rem;cursor:pointer;background:var(--bg);color:var(--text);flex:none;}
  .send{background:var(--green);color:#fff;border-color:var(--green);font-weight:600;}
  .mic.rec{background:var(--red);color:#fff;border-color:var(--red);}
  .barrow{display:flex;gap:0.5rem;margin-top:0.8rem;}
  .barrow button{flex:1;font-family:var(--mono);font-size:0.78rem;background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:0.55rem;border-radius:7px;cursor:pointer;}
  .recap .line{border-bottom:1px solid var(--border);padding:0.6rem 0;}
  .recap .line:last-child{border-bottom:none;}
  .recap .yours{font-family:var(--mono);color:var(--text);}
  .recap .target{font-size:0.82rem;color:var(--green);}
  .recap .tip{font-size:0.82rem;color:var(--red);margin-top:0.2rem;}
  .hidden{display:none;}
  .err{color:var(--red);font-size:0.8rem;margin-top:0.6rem;}
</style>
</head>

<div class="wrap">
<header>
  <svg width="30" height="20" viewBox="0 0 32 22" xmlns="http://www.w3.org/2000/svg">
    <rect width="12" height="22" fill="#006600"/><rect x="12" width="20" height="22" fill="#FF0000"/>
    <circle cx="12" cy="11" r="5" fill="#FFD700" stroke="#00008B" stroke-width="0.5"/>
    <circle cx="12" cy="11" r="3" fill="#00008B"/><circle cx="12" cy="11" r="1.5" fill="#FFD700"/>
  </svg>
  <div><h1>Conversas</h1></div>
</header>
<p class="sub">A1.1 · conversas curtas · fala e ouve</p>

<div id="setup" class="card">
  <h2 id="scenTitle">Na pastelaria</h2>
  <p class="note" id="scenIntro"></p>
  <label class="lab">Cenário</label>
  <select id="scenPick"></select>
  <label class="lab">Modo</label>
  <div class="seg" id="segMode">
    <button data-v="llm" class="on">Conversa livre<small>live AI, varies each time</small></button>
    <button data-v="script">Guião<small>fixed lines, no key</small></button>
  </div>
  <div id="keyWrap">
    <label class="lab">Anthropic API key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
    <p class="note">From console.anthropic.com. Not stored. Billed separately from Claude.ai.</p>
  </div>
  <button class="btn-go" id="btnStart">Começar</button>
  <p class="note">Type your reply, or dictate it with Whispr Flow, then press Enter. Stuck? Tap "ajuda".</p>
  <div class="err hidden" id="setupErr"></div>
</div>

<div id="convo" class="card hidden">
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">...</span></div>
  <div id="transcript"></div>
  <div id="helpBox" class="hidden"></div>
  <div class="inrow">
    <input type="text" id="userIn" placeholder="A tua resposta..." autocomplete="off" autocapitalize="off">
    <button class="mic" id="micBtn" title="ditar (Chrome)">🎤</button>
    <button class="help" id="helpBtn" title="ajuda">ajuda</button>
    <button class="send" id="sendBtn">Enviar</button>
  </div>
  <div class="barrow">
    <button id="repeatBtn">🔊 Repetir</button>
    <button id="endBtn">Terminar</button>
  </div>
</div>

<div id="recap" class="card hidden">
  <h2>Resumo</h2>
  <div class="recap" id="recapBody"></div>
  <button class="btn-go" id="againBtn">Outra vez</button>
</div>
</div>

      a:{say:'Bom dia! O que deseja?',hint:'Queria um quilo de maçãs, por favor.',match:[{any:['queria','quero','quilo','maca','laranja','tomate','banana','cenoura','fruta','meio'],go:'b'}],fallback:'Peça por peso: "Queria um quilo de maçãs".'},
      b:{say:'Mais alguma coisa?',hint:'Sim, meio quilo de tomates. / Não, é tudo.',match:[{any:['nao','so isso','e tudo','mais nada','obrigado','sim','mais','quilo','meio','tambem'],go:'c'}],fallback:'Diga "não, é tudo" ou peça mais.'},
      c:{say:'São três euros e cinquenta.',hint:'Aqui tem. / Com cartão, por favor.',match:[{any:['aqui tem','cartao','dinheiro','euros','tem','troco'],go:'d'}],fallback:'Diga "aqui tem" ou "com cartão".'},
      d:{say:'Obrigado! Bom dia.',end:true}
    }}
  },
  direcoes:{
    label:'Pedir direções', botName:'Senhor',
    intro:'You are lost in the street. Ask a local where a place is, whether it is far, and thank them.',
    persona:'a helpful local on a Lisbon street. The user is a visitor asking for directions.',
    flow:'offer to help, answer where the place is with simple directions (em frente, à esquerda, à direita, perto, longe), answer if it is far, accept thanks.',
    seed:'(Um visitante aproxima-se na rua para pedir ajuda.)',
    core:["desculpe","por favor","onde é","onde fica","a farmácia","a estação","o mercado","a rua","em frente","sempre em frente","à esquerda","à direita","perto","longe","aqui","ali","a pé","minutos","obrigado","de nada","precisa de ajuda"],
    script:{start:'a',steps:{
      a:{say:'Olá! Precisa de ajuda?',hint:'Desculpe, onde é a farmácia?',match:[{any:['onde','farmacia','estacao','mercado','rua','fica','metro','cafe'],go:'b'}],fallback:'Pergunte: "Desculpe, onde é a farmácia?"'},
      b:{say:'É perto. Vá sempre em frente e depois à esquerda.',hint:'É longe? / Obrigado!',match:[{any:['longe','perto','obrigado','quanto','minutos','a pe','esquerda','direita','sim'],go:'c'}],fallback:'Pergunte "é longe?" ou diga "obrigado".'},
      c:{say:'De nada! Bom dia.',end:true}
    }}
  },
  planos:{
    label:'Planos de fim de semana', botName:'Amiga',
    intro:'A friend chats about your weekend. Say what you did (past) and what you will do (future).',
    persona:'a friendly Portuguese friend chatting casually. The user is their friend.',
    flow:'ask how the weekend was, react, ask what they will do this weekend, react, suggest meeting for a coffee, accept or not, say goodbye. Use past (fui, fiz) and future (vou).',
    seed:'(Encontras uma amiga na rua.)',
    core:["olá","como foi","o teu fim de semana","foi bom","no sábado","no domingo","fui","fiz","fui ao ginásio","jantar","a praia","trabalhei","e tu","o que vais fazer","vou","vou para","vou jantar","que bom","boa ideia","queres ir ao café","amanhã","sim claro","não posso","talvez","até logo"],
    script:{start:'a',steps:{
      a:{say:'Olá! Como foi o teu fim de semana?',hint:'Foi bom. No sábado fui ao ginásio.',match:[{any:['foi','fui','fiz','sabado','domingo','ginasio','jantar','bom','praia','trabalhei'],go:'b'}],fallback:'Diga o que fez: "No sábado fui ao ginásio".'},
      b:{say:'Que bom! E o que vais fazer este fim de semana?',hint:'Vou jantar fora. / Vou para o Estoril.',match:[{any:['vou','vamos','jantar','praia','estoril','ginasio','cozinhar','nada','talvez'],go:'c'}],fallback:'Diga os planos: "Vou jantar fora".'},
      c:{say:'Boa ideia! Queres ir ao café amanhã?',hint:'Sim, claro! / Não posso, obrigado.',match:[{any:['sim','claro','nao','posso','talvez','obrigado','boa'],go:'d'}],fallback:'Responda "sim, claro" ou "não posso".'},
      d:{say:'Combinado! Até logo.',end:true}
    }}
  },
  apresentar:{
    label:'Conhecer alguém', botName:'Pessoa',
    intro:'You meet someone new. Give your name, where you are from, and what you do.',
    persona:'a friendly Portuguese person meeting the user for the first time at a social event.',
    flow:'say hello and ask the name, ask where they are from, ask what they do, react warmly, say goodbye.',
    seed:'(Conheces uma pessoa nova numa festa.)',
    core:["olá","boa noite","como se chama","chamo-me","o meu nome é","muito prazer","de onde é","sou de","sou dos estados unidos","sou americano","e você","o que faz","trabalho em","sou reformado","tecnologia","vendas","moro em lisboa","que interessante","foi um prazer","até logo"],
    script:{start:'a',steps:{
      a:{say:'Olá! Como se chama?',hint:'Chamo-me Dave. E você?',match:[{any:['chamo','sou','nome','dave','me chamo'],go:'b'}],fallback:'Diga o seu nome: "Chamo-me Dave".'},
      b:{say:'Muito prazer! De onde é?',hint:'Sou dos Estados Unidos. / Moro em Lisboa.',match:[{any:['sou de','sou dos','estados unidos','lisboa','americano','america','moro'],go:'c'}],fallback:'Diga de onde é: "Sou dos Estados Unidos".'},
      c:{say:'Que interessante! O que faz?',hint:'Trabalho em tecnologia. / Sou reformado.',match:[{any:['trabalho','sou','faco','reformado','vendas','tecnologia','negocios'],go:'d'}],fallback:'Diga o que faz: "Trabalho em tecnologia".'},
      d:{say:'Foi um prazer! Até logo.',end:true}
    }}
  }
};
let SCK='pastelaria';           // current scenario key
let SC=SCENARIOS[SCK];

let mode='llm',apiKey='',isSpeaking=false,sessionEnded=false;
let step=null,stepFails=0,yourLines=[],history=[],llmTurns=0,lastBot='';
let recognition=null,isListening=false;
const $=id=>document.getElementById(id);

// ----- scenario picker -----
(function(){
  const sel=$('scenPick');
  Object.keys(SCENARIOS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=SCENARIOS[k].label;sel.appendChild(o);});
  sel.value=SCK; applyScenario();
  sel.addEventListener('change',()=>{SCK=sel.value;applyScenario();});
})();
function applyScenario(){SC=SCENARIOS[SCK];$('scenTitle').textContent=SC.label;$('scenIntro').textContent=SC.intro+' Short turns, Portuguese only. No target line is shown.';}

$('segMode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.v;[...$('segMode').children].forEach(x=>x.classList.toggle('on',x===b));$('keyWrap').classList.toggle('hidden',mode!=='llm');});
$('btnStart').onclick=()=>{
  $('setupErr').classList.add('hidden');
  if(mode==='llm'){apiKey=$('apiKey').value.trim();if(!apiKey){$('setupErr').textContent='Paste an API key or switch to Guião.';$('setupErr').classList.remove('hidden');return;}}
  $('setup').classList.add('hidden');$('recap').classList.add('hidden');$('convo').classList.remove('hidden');
  sessionEnded=false;yourLines=[];history=[];llmTurns=0;stepFails=0;lastBot='';$('transcript').innerHTML='';hideHelp();
  initSTT();
  if(mode==='script')startScripted();else startLLM();
};
$('againBtn').onclick=()=>{$('recap').classList.add('hidden');$('setup').classList.remove('hidden');};

async function speak(text,onEnd){
  if(!text){if(onEnd)onEnd();return;}
  isSpeaking=true;setStatus('speaking','A falar...');
  try{
    const body={text};if(VOICE_ID)body.voice_id=VOICE_ID;
    const res=await fetch(TTS_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok)throw new Error('TTS '+res.status);
    const url=URL.createObjectURL(await res.blob());const audio=new Audio(url);window._lastAudio=audio;
    audio.onended=()=>{isSpeaking=false;if(onEnd)onEnd();};
    audio.onerror=()=>{isSpeaking=false;if(onEnd)onEnd();};
    audio.play().catch(()=>{isSpeaking=false;if(onEnd)onEnd();});
  }catch(e){isSpeaking=false;if(onEnd)onEnd();}
}
$('repeatBtn').onclick=()=>{if(window._lastAudio){window._lastAudio.currentTime=0;window._lastAudio.play().catch(()=>{});}};

function addTurn(who,text,cls){
  const t=document.createElement('div');t.className='turn '+cls;
  const w=document.createElement('div');w.className='who';w.textContent=who;
  const b=document.createElement('div');b.className='bubble';b.textContent=text;
  if(cls==='bot'){const r=document.createElement('button');r.className='replay';r.textContent='🔊';r.onclick=()=>speak(text);b.appendChild(r);lastBot=text;}
  t.appendChild(w);t.appendChild(b);$('transcript').appendChild(t);$('transcript').scrollTop=$('transcript').scrollHeight;
}
function setStatus(cls,text){$('dot').className='dot '+(cls||'');$('statusText').textContent=text||'';}
function hideHelp(){$('helpBox').classList.add('hidden');$('helpBox').innerHTML='';}
function showHelp(en,reply){$('helpBox').innerHTML=(en?'<div class="hb-en">'+esc(en)+'</div>':'')+(reply?'<div class="hb-reply">ex: '+esc(reply)+'</div>':'');$('helpBox').classList.remove('hidden');}

function submitUser(){
  const v=$('userIn').value.trim();if(!v||isSpeaking||sessionEnded)return;
  $('userIn').value='';hideHelp();addTurn('Tu',v,'you');
  if(mode==='script')handleScripted(v);else handleLLM(v);
}
$('sendBtn').onclick=submitUser;
$('userIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitUser();}});
$('endBtn').onclick=()=>endSession();
$('helpBtn').onclick=doHelp;

// ===== scripted =====
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function startScripted(){step=SC.script.start;stepFails=0;sayStep();}
function sayStep(){const s=SC.script.steps[step];addTurn(SC.botName,s.say,'bot');speak(s.say,()=>{if(s.end){endSession();return;}setStatus('listening','A tua vez');$('userIn').focus();});}
function handleScripted(v){
  const s=SC.script.steps[step],n=norm(v);let go=null;
  for(const r of(s.match||[])){if(r.any.some(k=>n.includes(norm(k)))){go=r.go;break;}}
  yourLines.push({said:v});
  if(go){stepFails=0;step=go;setStatus('thinking','');setTimeout(sayStep,350);}
  else{stepFails++;const only=(s.match&&s.match[0])?s.match[0].go:null;
    addTurn(SC.botName,s.fallback,'bot');
    if(stepFails>=2&&only)speak(s.fallback,()=>{stepFails=0;step=only;setTimeout(sayStep,400);});
    else speak(s.fallback,()=>{setStatus('listening','A tua vez');$('userIn').focus();});}
}

// ===== LLM =====
function llmSystem(){return [
  'You are '+SC.persona,
  'The user is an A1 beginner learning European Portuguese.',
  'RULES:',
  '- European Portuguese only (pt-PT, never Brazilian). Never English.',
  '- One short sentence per turn, maximum 8 words. No lists.',
  '- Prefer these core words for this scene: '+SC.core.join(', ')+'.',
  '- You may also use words the student already knows: '+RECENT.join(', ')+'.',
  '- Do not use words outside those sets, except names and numbers. Forms (plurals, conjugations, contractions) of allowed words are fine.',
  '- Vary the details each time so the conversation is not identical, but stay in the situation.',
  '- Flow: '+SC.flow,
  '- Keep it to about 6 exchanges, then close with a short goodbye (e.g. "Até logo." or "Bom dia.") and nothing after.',
  '- Never correct the user mid-conversation. Just continue.'
].join('\n');}
async function apiCall(messages,system,max){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(Object.assign({model:MODEL,max_tokens:max,messages},system?{system}:{}))});
  if(!res.ok){const t=await res.text().catch(()=> '');throw new Error('API '+res.status+' '+t.slice(0,120));}
  const d=await res.json();return d.content[0].text;
}
async function startLLM(){
  setStatus('thinking','A começar...');
  try{
    const reply=cleanForSpeech(await apiCall([{role:'user',content:SC.seed}],llmSystem(),60));
    history.push({role:'user',content:SC.seed},{role:'assistant',content:reply});
    addTurn(SC.botName,reply,'bot');
    speak(reply,()=>{setStatus('listening','A tua vez');$('userIn').focus();});
  }catch(e){setStatus('','Erro: '+e.message);addTurn('Sistema','Erro ao contactar a API. Verifica a chave e os créditos. '+e.message,'bot');}
}
async function handleLLM(v){
  history.push({role:'user',content:v});yourLines.push({said:v});llmTurns++;setStatus('thinking','A pensar...');
  try{
    const reply=cleanForSpeech(await apiCall(history,llmSystem(),60));
    history.push({role:'assistant',content:reply});addTurn(SC.botName,reply,'bot');
    const done=llmTurns>=MAX_LLM_TURNS||/bom dia\.?\s*$|boa noite\.?\s*$|at[ée] logo|at[ée] j[áa]|combinado|de nada\.?\s*$/i.test(reply);
    speak(reply,()=>{if(done)endSession();else{setStatus('listening','A tua vez');$('userIn').focus();}});
  }catch(e){setStatus('','Erro: '+e.message);addTurn('Sistema','Erro: '+e.message,'bot');}
}
function cleanForSpeech(t){return t.replace(/\*\*/g,'').replace(/\*/g,'').replace(/^[-\d.]+\s/gm,'').replace(/#{1,6}\s/g,'').trim();}

// ===== ajuda (on demand only) =====
async function doHelp(){
  if(mode==='script'){const s=SC.script.steps[step];if(s)showHelp('',s.hint);return;}
  if(!lastBot){return;}
  showHelp('...','');setStatus('thinking','ajuda...');
  try{
    const raw=await apiCall([{role:'user',content:'In a European Portuguese roleplay ('+SC.label+'), the other person just said: "'+lastBot+'". Reply ONLY with JSON, no markdown: {"en":"what it means in English, under 12 words","reply":"one short European Portuguese reply an A1 learner could say here"}'}],null,150);
    const j=JSON.parse(raw.replace(/```json|```/g,'').trim());showHelp(j.en,j.reply);
  }catch(e){showHelp('(ajuda indisponível: '+e.message+')','');}
  setStatus('listening','A tua vez');
}

// ===== STT (optional; Whispr Flow into the box is primary) =====
function initSTT(){
  if(recognition)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('micBtn').style.display='none';return;}
  recognition=new SR();recognition.lang='pt-PT';recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=e=>{if(e.results[0].isFinal){$('userIn').value=e.results[0][0].transcript.trim();isListening=false;$('micBtn').classList.remove('rec');}};
  recognition.onerror=()=>{isListening=false;$('micBtn').classList.remove('rec');};
  recognition.onend=()=>{isListening=false;$('micBtn').classList.remove('rec');};
}
$('micBtn').onclick=()=>{if(!recognition||isSpeaking)return;if(isListening){recognition.stop();return;}isListening=true;$('micBtn').classList.add('rec');try{recognition.start();}catch(e){isListening=false;$('micBtn').classList.remove('rec');}};

// ===== end + recap =====
function endSession(){
  if(sessionEnded)return;sessionEnded=true;try{if(recognition)recognition.stop();}catch(e){}
  setStatus('','');$('convo').classList.add('hidden');$('recap').classList.remove('hidden');
  if(mode==='script')renderScriptedRecap();else renderLLMRecap();
}
function renderScriptedRecap(){
  const body=$('recapBody');body.innerHTML='';
  if(!yourLines.length){body.innerHTML='<p class="note">Sem respostas.</p>';return;}
  yourLines.forEach(l=>{const d=document.createElement('div');d.className='line';
    let h='<div class="yours">Tu: '+esc(l.said)+'</div>';
    if(/\bquero\b/i.test(l.said))h+='<div class="tip">Lembra: dizes "queria", não "quero", para pedir.</div>';
    d.innerHTML=h;body.appendChild(d);});
}
async function renderLLMRecap(){
  const body=$('recapBody');body.innerHTML='<p class="note">A avaliar...</p>';
  const transcript=history.filter(m=>m.content!==SC.seed).map(m=>(m.role==='user'?'TU':SC.botName.toUpperCase())+': '+m.content).join('\n');
  const prompt='You are a kind European Portuguese tutor. The student (TU) is A1. Roleplay ('+SC.label+') transcript:\n\n'+transcript+'\n\nReturn ONLY valid JSON, no markdown: {"good":["..."],"fix":[{"said":"what they wrote","better":"corrected pt-PT","why":"short English reason"}]}. Max 2 in good, max 3 in fix. Only real errors. European Portuguese.';
  try{
    const raw=await apiCall([{role:'user',content:prompt}],null,700);
    const j=JSON.parse(raw.replace(/```json|```/g,'').trim());body.innerHTML='';
    if(j.good&&j.good.length){const g=document.createElement('div');g.className='line';g.innerHTML='<div class="target">Bem: '+j.good.map(esc).join(' · ')+'</div>';body.appendChild(g);}
    (j.fix||[]).forEach(f=>{const d=document.createElement('div');d.className='line';d.innerHTML='<div class="yours">Tu: '+esc(f.said)+'</div><div class="target">Melhor: '+esc(f.better)+'</div><div class="tip">'+esc(f.why)+'</div>';body.appendChild(d);});
    if(!body.children.length)body.innerHTML='<p class="note">Boa conversa, sem correções.</p>';
  }catch(e){body.innerHTML='<p class="note">Não foi possível avaliar ('+esc(e.message)+'). O que disseste:</p>';yourLines.forEach(l=>{const d=document.createElement('div');d.className='line';d.innerHTML='<div class="yours">Tu: '+esc(l.said)+'</div>';body.appendChild(d);});}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
